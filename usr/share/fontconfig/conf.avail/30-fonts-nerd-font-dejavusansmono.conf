<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Nerd Fonts 3 renamed DejaVuSansMono Nerd Font to DejaVuSansM Nerd Font -->
  <alias binding="same">
    <family>DejaVuSansMono Nerd Font</family>
    <prefer><family>DejaVuSansM Nerd Font</family></prefer>
  </alias>
  <alias binding="same">
    <family>DejaVuSansMono Nerd Font Mono</family>
    <prefer><family>DejaVuSansM Nerd Font Mono</family></prefer>
  </alias>
</fontconfig>
