<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Nerd Fonts 3 renamed BitstreamVeraSansMono Nerd Font to BitstromWera Nerd Font -->
  <alias binding="same">
    <family>BitstreamVeraSansMono Nerd Font</family>
    <prefer><family>BitstromWera Nerd Font</family></prefer>
  </alias>
  <alias binding="same">
    <family>BitstreamVeraSansMono Nerd Font Mono</family>
    <prefer><family>BitstromWera Nerd Font Mono</family></prefer>
  </alias>
</fontconfig>
